<h1 style="margin:0 0 26px;font:800 68px/1.02 'Open Sans',sans-serif;letter-spacing:-.03em;color:#232d35;text-wrap:balance">The Workforce<br>Is Yours. <span style="color:#0081BB">One workforce.<br>Your terms.</span></h1>
<p style="margin:0 0 22px;font:600 21px/1.5 'Open Sans',sans-serif;color:#3b4954;max-width:31ch">Your workforce strategy should be built around your organization — not around one staffing supplier, marketplace or technology ecosystem.</p>
<p style="margin:0 0 32px;font:400 16.5px/1.7 'Open Sans',sans-serif;color:#5e6e78;max-width:52ch">Trio is a healthcare-built VMS for U.S. contingent workforce management. Internal, permanent and contingent labor come together in one connected workforce model, with managed, hybrid and self-managed options that can evolve without a rebuild. The health system keeps control of the data, governance and decisions that shape how the program runs.</p>
<div style="display:flex;flex-wrap:wrap;gap:14px;margin-bottom:30px">
<a href="#assessment" style="display:inline-flex;align-items:center;gap:10px;padding:16px 28px;border-radius:999px;background:#0081BB;color:#fff;font:700 15.5px/1 'Open Sans',sans-serif;box-shadow:0 6px 18px rgba(0,129,187,.24)" style-hover="background:#006a9b">Start a Workforce Architecture Assessment</a>

</div>
<div style="display:flex;flex-wrap:wrap;gap:10px">
<span style="padding:9px 16px;border-radius:999px;border:1px solid #dfe3e6;background:#fff;font:600 13.5px/1 'Open Sans',sans-serif;color:#455560">Own the Model</span>
<span style="padding:9px 16px;border-radius:999px;border:1px solid #dfe3e6;background:#fff;font:600 13.5px/1 'Open Sans',sans-serif;color:#455560">Choice Without Compromise</span>
<span style="padding:9px 16px;border-radius:999px;border:1px solid #dfe3e6;background:#fff;font:600 13.5px/1 'Open Sans',sans-serif;color:#455560">A Model That Moves With You</span>
<span style="padding:9px 16px;border-radius:999px;border:1px solid #dfe3e6;background:#fff;font:600 13.5px/1 'Open Sans',sans-serif;color:#455560">Better Managed Spend</span>

<h2 style="margin:0 0 24px;font:800 46px/1.1 'Open Sans',sans-serif;letter-spacing:-.025em;color:#232d35">Who owns the model<br>your workforce runs on?</h2>
<p style="margin:0 0 18px;font:400 17px/1.75 'Open Sans',sans-serif;color:#5e6e78">Scale matters. Supply matters. Technology and managed services matter. But when one company provides the talent, the technology and the operating model, a more important question emerges:</p>

<p style="margin:0;font:600 17px/1.7 'Open Sans',sans-serif;color:#232d35">How much control do you have over how your workforce runs?</p><p style="margin:0 0 18px;font:400 17px/1.75 'Open Sans',sans-serif;color:#5e6e78">The issue is bigger than features. It is about who owns the decisions, the data and the rules that shape your workforce — and whether you can change the model as your needs evolve.</p><p style="margin:0;font:600 17px/1.7 'Open Sans',sans-serif;color:#232d35">The workforce is yours. The model should be too.</p>
</div>
<div style="background:#fff;border:1px solid #eceef0;border-radius:14px;box-shadow:0 10px 34px rgba(27,35,42,.07);padding:32px 30px">
<div style="font:700 11px/1 'Open Sans',sans-serif;letter-spacing:.13em;text-transform:uppercase;color:#b65e10;margin-bottom:18px">Signals the model may not be yours</div>
<div style="display:flex;flex-direction:column;gap:0">
<div style="display:flex;gap:14px;padding:16px 0;border-bottom:1px solid #eceef0"><span style="flex:none;width:22px;height:24px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:#F58220"></span><span style="font:400 15px/1.55 'Open Sans',sans-serif;color:#455560">Changing suppliers means changing technology — or the reverse.</span></div>
<div style="display:flex;gap:14px;padding:16px 0;border-bottom:1px solid #eceef0"><span style="flex:none;width:22px;height:24px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:#0081BB"></span><span style="font:400 15px/1.55 'Open Sans',sans-serif;color:#455560">Internal float pools, permanent hiring and contingent labor are managed as three separate strategies.</span></div>
<div style="display:flex;gap:14px;padding:16px 0;border-bottom:1px solid #eceef0"><span style="flex:none;width:22px;height:24px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:#79BB43"></span><span style="font:400 15px/1.55 'Open Sans',sans-serif;color:#455560">Not every source of supply is measured against the same expectations.</span></div>
<div style="display:flex;gap:14px;padding:16px 0;border-bottom:1px solid #eceef0"><span style="flex:none;width:22px;height:24px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:#F58220"></span><span style="font:400 15px/1.55 'Open Sans',sans-serif;color:#455560">Rate reporting is available; total workforce economics are not.</span></div>
<div style="display:flex;gap:14px;padding:16px 0"><span style="flex:none;width:22px;height:24px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:#0081BB"></span><span style="font:400 15px/1.55 'Open Sans',sans-serif;color:#455560">Your program data lives somewhere you cannot fully govern.</span></div>

<section id="faq" style="background:#f7fafb;padding:96px 0">
<div style="max-width:1240px;margin:0 auto;padding:0 40px">
<div style="display:flex;align-items:center;gap:12px;margin-bottom:18px"><span style="font: 700 12px / 1 &quot;Open Sans&quot;, sans-serif; letter-spacing: 0.12em; color: rgb(0, 129, 187);"><span style="letter-spacing: 0.14em; text-transform: uppercase;">Questions we get</span></span></div>
<h2 style="margin:0 0 44px;font:800 44px/1.1 'Open Sans',sans-serif;letter-spacing:-.025em;color:#232d35">Healthcare workforce<br>management, answered plainly.</h2>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:22px">
<div style="background:#fff;border:1px solid #eceef0;border-radius:14px;padding:28px 28px"><h3 style="margin:0 0 10px;font:700 18.5px/1.35 'Open Sans',sans-serif;color:#232d35">What is a healthcare VMS?</h3><p style="margin:0;font:400 15.5px/1.7 'Open Sans',sans-serif;color:#5e6e78">A vendor management system is the technology a hospital or health system uses to manage contingent labor end to end — requisitions, submissions, credentialing, scheduling, timecards, billing and supplier performance. A healthcare VMS models clinical realities such as licensure, privileging, unit-level scheduling and float pools rather than treating clinicians as generic contractors.</p></div>
<div style="background:#fff;border:1px solid #eceef0;border-radius:14px;padding:28px 28px"><h3 style="margin:0 0 10px;font:700 18.5px/1.35 'Open Sans',sans-serif;color:#232d35">What does it mean for a VMS to be independent of supply?</h3><p style="margin:0;font:400 15.5px/1.7 'Open Sans',sans-serif;color:#5e6e78">It means the platform you use to compare, award and govern work is not owned by a company competing to fill that work. Every supplier — including internal resources — is measured against the same expectations, and the health system decides where volume goes.</p></div>
<div style="background:#fff;border:1px solid #eceef0;border-radius:14px;padding:28px 28px"><h3 style="margin:0 0 10px;font:700 18.5px/1.35 'Open Sans',sans-serif;color:#232d35">Can we change suppliers without replacing the technology?</h3><p style="margin:0;font:400 15.5px/1.7 'Open Sans',sans-serif;color:#5e6e78">Yes. Supplier changes, added specialties and shifts in operating responsibility are configuration decisions inside Trio VMS — not a program rebuild. Managed, hybrid and self-managed operating models are settings, so responsibility can move without the model being torn down.</p></div>
<div style="background:#fff;border:1px solid #eceef0;border-radius:14px;padding:28px 28px"><h3 style="margin:0 0 10px;font:700 18.5px/1.35 'Open Sans',sans-serif;color:#232d35">How do internal float pools fit a total workforce model?</h3><p style="margin:0;font:400 15.5px/1.7 'Open Sans',sans-serif;color:#5e6e78">Internal resource management sits alongside external supply in the same demand view, so open need is offered internally first and escalated outward on your rules. Permanent, internal and contingent labor are planned as one workforce strategy instead of three.</p></div>
<div style="background:#fff;border:1px solid #eceef0;border-radius:14px;padding:28px 28px"><h3 style="margin:0 0 10px;font:700 18.5px/1.35 'Open Sans',sans-serif;color:#232d35">How long does a transition take?</h3><p style="margin:0;font:400 15.5px/1.7 'Open Sans',sans-serif;color:#5e6e78">It depends on program size, integrations and how many facilities go live at once. The assessment produces a transition roadmap with sequencing, owners and the risks worth planning around — before any commitment.</p></div>
<div style="background:#fff;border:1px solid #eceef0;border-radius:14px;padding:28px 28px"><h3 style="margin:0 0 10px;font:700 18.5px/1.35 'Open Sans',sans-serif;color:#232d35">Do you work with California health systems?</h3><p style="margin:0;font:400 15.5px/1.7 'Open Sans',sans-serif;color:#5e6e78">Yes. Trio Workforce Solutions supports health systems nationally and is actively working with California organizations on nursing, allied health and locums programs — including California-specific rate, ratio and compliance considerations.</p></div>
</div>
</div>
</section>
